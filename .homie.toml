# "gh:owner/repo" = latest GitHub release into ~/.local/bin; anything else = install command.
[packages]
starship = "gh:starship/starship"
zoxide   = "gh:ajeetdsouza/zoxide"
atuin    = "gh:atuinsh/atuin"
fnm      = "gh:Schniz/fnm"
fzf      = "gh:junegunn/fzf"
uv       = "gh:astral-sh/uv"
claude   = "curl -fsSL https://claude.ai/install.sh | bash"
codex    = "curl -fsSL https://chatgpt.com/codex/install.sh | CODEX_NON_INTERACTIVE=1 sh"
